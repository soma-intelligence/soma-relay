[workspace]
resolver = "3"
members = ["crates/relay-core", "crates/relay-ffi", "crates/relay-wasm", "crates/relay-node", "crates/relay-bot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/soma-intelligence/soma-relay"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
