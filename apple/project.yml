name: SomaRelay
options:
  bundleIdPrefix: me.somalabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: M968YV4J8W
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.9.0"
  WebRTC:
    url: https://github.com/webrtc-sdk/Specs.git
    exactVersion: "150.7871.08"
targets:
  SomaRelay:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: RelayCore
      - package: GRDB
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.relay
        PRODUCT_NAME: SomaRelay
        TARGETED_DEVICE_FAMILY: "1"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/SomaRelay.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Soma Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - voip
          - location
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - me.somalabs.relay.refresh
        NSLocationWhenInUseUsageDescription: Soma Relay utilise ta position seulement quand tu choisis de l'envoyer ou de la partager en direct dans une conversation.
        NSCameraUsageDescription: Soma Relay utilise la caméra pour scanner le QR d'un contact, prendre des photos à envoyer ou ta photo de profil, et passer des appels vidéo.
        NSMicrophoneUsageDescription: Soma Relay utilise le micro pour les notes vocales et les appels.
        NSPhotoLibraryUsageDescription: Soma Relay accède à tes photos seulement quand tu choisis d'en envoyer une ou d'en faire ta photo de profil ou celle d'un groupe.
        NSPhotoLibraryAddUsageDescription: Soma Relay enregistre dans tes photos les images que tu choisis de garder.
        NSBluetoothAlwaysUsageDescription: Soma Relay utilise le Bluetooth pour faire passer tes messages de téléphone en téléphone, même sans réseau.
        NSLocalNetworkUsageDescription: Soma Relay cherche les téléphones proches pour faire passer tes messages chiffrés sans Internet.
        NSBonjourServices:
          - _soma-relay._tcp
          - _soma-relay._udp
        CFBundleURLTypes:
          - CFBundleURLName: me.somalabs.relay
            CFBundleURLSchemes:
              - somarelay
  # relay-core through UniFFI. Sources/RelayCore/RelayCoreFFI.swift and
  # Frameworks/RelayCoreFFI.xcframework are generated by crates/relay-ffi (do not edit).
  RelayCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/RelayCore
    dependencies:
      - framework: Frameworks/RelayCoreFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.relay.core
        PRODUCT_NAME: RelayCore
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        OTHER_LDFLAGS: -lc++
  # Simulator step driver (UITests/RelayScriptUITests.swift), run by hand, not in CI.
  SomaRelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SomaRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.relay.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SomaRelay
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  SomaRelay:
    build:
      targets:
        SomaRelay: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SomaRelayUITests
    archive:
      config: Release
